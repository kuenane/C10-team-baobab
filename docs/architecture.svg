<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    .stage-title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .stage-sub { font-size: 11.5px; fill: #444; }
    .section-label { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: 0.5px; }
    .box { stroke-width: 1.5; rx: 10; }
    .conn { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .conn-dashed { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowDashed); }
  </style>

  <rect x="0" y="0" width="1000" height="1500" fill="#fafafa"/>
  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Agriculture &amp; Climate SLM — Pipeline Architecture</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#666">Retrieval-grounded generation + QLoRA fine-tune (offline, Kaggle)</text>

  <!-- 1. DATA SOURCES -->
  <text x="60" y="100" class="section-label">DATA</text>
  <rect x="60" y="108" width="270" height="70" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="80" y="132" class="stage-title">documents.csv</text>
  <text x="80" y="150" class="stage-sub">24 docs: topic, crop, agro_zone, text</text>
  <text x="80" y="166" class="stage-sub">source-of-truth grounding text</text>

  <rect x="365" y="108" width="270" height="70" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="385" y="132" class="stage-title">train_qa.csv</text>
  <text x="385" y="150" class="stage-sub">45 rows: question + reference_answer</text>
  <text x="385" y="166" class="stage-sub">+ document_id label</text>

  <rect x="670" y="108" width="270" height="70" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="690" y="132" class="stage-title">test_questions.csv</text>
  <text x="690" y="150" class="stage-sub">12 rows: question, topic, crop,</text>
  <text x="690" y="166" class="stage-sub">agro_zone (no answer)</text>

  <!-- connectors from data to retrieval -->
  <path class="conn" d="M195,178 L195,220 L500,220 L500,240"/>
  <path class="conn" d="M500,178 L500,240"/>
  <path class="conn" d="M805,178 L805,220 L500,220"/>

  <!-- 2. RETRIEVAL -->
  <text x="60" y="222" class="section-label">RETRIEVAL</text>
  <rect x="300" y="242" width="400" height="90" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="320" y="266" class="stage-title">Deterministic Retrieval</text>
  <text x="320" y="284" class="stage-sub">key = (topic, crop, agro_zone) → document_id</text>
  <text x="320" y="300" class="stage-sub">ambiguous / zero-match key → TF-IDF cosine</text>
  <text x="320" y="316" class="stage-sub">similarity fallback over candidate doc text</text>

  <path class="conn" d="M500,332 L500,360"/>

  <rect x="300" y="360" width="400" height="56" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="320" y="382" class="stage-title">Validation Harness</text>
  <text x="320" y="400" class="stage-sub">asserts 0 mismatches across all 45 train rows</text>

  <!-- 3. AUGMENTATION -->
  <path class="conn" d="M500,416 L500,444"/>
  <text x="60" y="450" class="section-label">DATA AUGMENTATION</text>
  <rect x="220" y="470" width="560" height="100" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="240" y="494" class="stage-title">Question-Paraphrase Augmentation</text>
  <text x="240" y="512" class="stage-sub">Base model (Gemma-2-2b-it) rewrites question text only, n=2 samples/row</text>
  <text x="240" y="528" class="stage-sub">reference_answer &amp; document_id copied verbatim from source row</text>
  <text x="240" y="544" class="stage-sub">45 rows → 90 paraphrased pairs (train-split originals only join SFT set)</text>
  <text x="240" y="560" class="stage-sub">generation model freed from GPU memory after this step</text>

  <!-- 4. SFT DATASET -->
  <path class="conn" d="M500,570 L500,598"/>
  <text x="60" y="606" class="section-label">SFT DATASET</text>
  <rect x="140" y="626" width="330" height="86" class="box" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="160" y="650" class="stage-title">Train / Val Split</text>
  <text x="160" y="668" class="stage-sub">80/20 split of the original 45 rows</text>
  <text x="160" y="684" class="stage-sub">(val kept answer-clean, never paraphrased)</text>
  <text x="160" y="700" class="stage-sub">→ train_core (36) / val_core (9)</text>

  <rect x="530" y="626" width="330" height="86" class="box" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="550" y="650" class="stage-title">Prompt Builder</text>
  <text x="550" y="668" class="stage-sub">"Context: {doc.text}</text>
  <text x="550" y="684" class="stage-sub">Question: {q}</text>
  <text x="550" y="700" class="stage-sub">Answer (one short sentence):" → completion</text>

  <path class="conn" d="M305,712 L305,742 L500,742"/>
  <path class="conn" d="M695,712 L695,742 L500,742"/>

  <rect x="300" y="742" width="400" height="56" class="box" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="320" y="764" class="stage-title">SFT dataset: 108 examples</text>
  <text x="320" y="782" class="stage-sub">train_core (36) + filtered augmented pairs (72)</text>

  <!-- 5. QLoRA -->
  <path class="conn" d="M500,798 L500,826"/>
  <text x="60" y="832" class="section-label">FINE-TUNE</text>
  <rect x="180" y="852" width="640" height="140" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="200" y="878" class="stage-title">QLoRA Fine-Tune — base model: Gemma-2-2b-it</text>
  <text x="200" y="898" class="stage-sub">4-bit NF4 quant via bitsandbytes when available, else plain bf16 LoRA fallback</text>
  <text x="200" y="916" class="stage-sub">LoRA r=16, α=32, dropout=0.05 on q/k/v/o/gate/up/down proj (0.79% trainable params)</text>
  <text x="200" y="934" class="stage-sub">Custom collator masks prompt tokens with -100 (completion-only loss)</text>
  <text x="200" y="952" class="stage-sub">HF Trainer, 3 epochs, batch 4 × grad-accum 4, lr 2e-4, bf16</text>
  <text x="200" y="970" class="stage-sub">→ LoRA adapter weights (train_loss ≈ 0.58 at final step)</text>

  <!-- 6. GENERATION -->
  <path class="conn" d="M500,992 L500,1020"/>
  <text x="60" y="1026" class="section-label">GENERATION</text>
  <rect x="140" y="1046" width="330" height="120" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="160" y="1070" class="stage-title">Sampled Candidates</text>
  <text x="160" y="1088" class="stage-sub">Fine-tuned model, n=6 samples</text>
  <text x="160" y="1104" class="stage-sub">temperature 0.7, top_p 0.9</text>
  <text x="160" y="1120" class="stage-sub">+ 1 extractive candidate:</text>
  <text x="160" y="1136" class="stage-sub">TF-IDF most-relevant sentence</text>
  <text x="160" y="1152" class="stage-sub">pulled straight from retrieved doc</text>

  <rect x="530" y="1046" width="330" height="120" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="550" y="1070" class="stage-title">MBR Selection</text>
  <text x="550" y="1088" class="stage-sub">Postprocess each candidate</text>
  <text x="550" y="1104" class="stage-sub">(strip prefix, first sentence, punctuation)</text>
  <text x="550" y="1120" class="stage-sub">Pick candidate minimizing total</text>
  <text x="550" y="1136" class="stage-sub">Levenshtein distance to all others</text>
  <text x="550" y="1152" class="stage-sub">— same metric the contest scores on</text>

  <path class="conn" d="M305,1166 L305,1190 L500,1190"/>
  <path class="conn" d="M695,1166 L695,1190 L500,1190"/>

  <!-- 7. EVAL LOOP -->
  <rect x="300" y="1190" width="400" height="60" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="320" y="1214" class="stage-title">Holdout Evaluation</text>
  <text x="320" y="1234" class="stage-sub">mean Levenshtein vs. val_core, compared to TF-IDF baseline</text>

  <!-- 8. SUBMISSION -->
  <path class="conn" d="M500,1250 L500,1278"/>
  <text x="60" y="1284" class="section-label">OUTPUT</text>
  <rect x="250" y="1304" width="500" height="90" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="270" y="1330" class="stage-title">Assertion-Guarded submission.csv</text>
  <text x="270" y="1350" class="stage-sub">checks: row count, QuestionId order, no empty/null answers</text>
  <text x="270" y="1368" class="stage-sub">write only if every assertion passes</text>

  <!-- dashed feedback arrow: validation harness informs retrieval trust -->
  <path class="conn-dashed" d="M300,388 C 140,388 100,300 240,270"/>
  <text x="45" y="360" font-size="10.5" fill="#b45309">must pass before</text>
  <text x="45" y="373" font-size="10.5" fill="#b45309">trusting retrieval</text>

  <!-- dashed feedback: holdout eval informs generation params -->
  <path class="conn-dashed" d="M300,1220 C 130,1220 130,1120 140,1106"/>
  <text x="20" y="1180" font-size="10.5" fill="#b45309">tunes n_samples,</text>
  <text x="20" y="1193" font-size="10.5" fill="#b45309">temperature, use_mbr</text>

  <!-- legend -->
  <g transform="translate(60,1420)">
    <rect x="0" y="0" width="16" height="16" fill="#eef2ff" stroke="#6366f1"/>
    <text x="22" y="13" font-size="11.5" fill="#333">Raw data</text>
    <rect x="120" y="0" width="16" height="16" fill="#ecfdf5" stroke="#059669"/>
    <text x="142" y="13" font-size="11.5" fill="#333">Retrieval</text>
    <rect x="230" y="0" width="16" height="16" fill="#eff6ff" stroke="#2563eb"/>
    <text x="252" y="13" font-size="11.5" fill="#333">Augmentation</text>
    <rect x="370" y="0" width="16" height="16" fill="#fdf4ff" stroke="#a21caf"/>
    <text x="392" y="13" font-size="11.5" fill="#333">SFT prep</text>
    <rect x="480" y="0" width="16" height="16" fill="#fff1f2" stroke="#e11d48"/>
    <text x="502" y="13" font-size="11.5" fill="#333">Fine-tune</text>
    <rect x="580" y="0" width="16" height="16" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="602" y="13" font-size="11.5" fill="#333">Generation</text>
    <rect x="690" y="0" width="16" height="16" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="712" y="13" font-size="11.5" fill="#333">Output</text>
  </g>
</svg>
